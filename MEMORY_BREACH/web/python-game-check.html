<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MEMORY BREACH — Game Python check</title>
<style>body{background:#07101c;color:#d4f4ed;font:16px system-ui;max-width:900px;margin:40px auto;padding:20px}button{padding:14px;background:#83f4ce;border:0;border-radius:8px;font:inherit}pre{white-space:pre-wrap;overflow-wrap:anywhere}</style>
<h1>Game terminal integration check</h1><p>This starts the actual game in headless mode and sends a Python command through its terminal.</p>
<button id="run">Test game Python</button><pre id="result">Ready.</pre><canvas id="canvas" width="16" height="16" hidden></canvas>
<script src="python_bridge.js"></script><script src="index.js"></script><script>
document.getElementById('run').addEventListener('click',async()=>{
 document.getElementById('run').disabled=true;
 document.getElementById('result').textContent='Starting Godot…\n';
 const engine=new Engine({executable:'index',mainPack:'index.pck',canvas:document.getElementById('canvas'),canvasResizePolicy:0,
  args:['--headless','--script','res://scripts/browser_python_e2e.gd'],
  onPrint:(text)=>document.getElementById('result').textContent+=text+'\n',
  onPrintError:(text)=>document.getElementById('result').textContent+='ERROR: '+text+'\n'});
 try{await engine.startGame();}catch(error){document.getElementById('result').textContent+='START ERROR: '+error;}
});
</script></html>
